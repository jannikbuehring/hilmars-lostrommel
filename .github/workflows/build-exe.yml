name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags, so the config template can be compared
          # against the previous release.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      # Ship the documented defaults: the spec copies config/config.ini next to
      # the exe, so the exe always starts from a known, reviewed config.
      - name: Use config template as shipped config
        run: Copy-Item config/config_template.ini config/config.ini -Force

      - name: Build exe
        run: pyinstaller --noconfirm hilmars_lostrommel.spec

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: hilmars_lostrommel-windows
          path: dist/

      # The Nextcloud share keeps the user's config.ini across releases, so the
      # config is only shipped there when the template changed since the
      # previous release tag (HEAD^, so a tag build skips its own tag).
      - name: Check whether the config template changed
        id: cfg
        shell: bash
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          if [ -z "$prev" ] || ! git diff --quiet "$prev" HEAD -- config/config_template.ini; then
            echo "include=true" >> "$GITHUB_OUTPUT"
          else
            echo "include=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Previous release: ${prev:-none}"

      - name: Zip for Nextcloud
        id: zip
        shell: pwsh
        run: |
          $release = Get-ChildItem dist -Directory -Filter 'hilmars_lostrommel_v*' | Select-Object -First 1
          $staging = Join-Path dist/nextcloud $release.Name
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item (Join-Path $release.FullName '*.exe') $staging
          if ('${{ steps.cfg.outputs.include }}' -eq 'true') {
            Copy-Item (Join-Path $release.FullName 'config') $staging -Recurse
          }
          $zip = "$($release.Name).zip"
          Compress-Archive -Path $staging -DestinationPath (Join-Path dist $zip) -Force
          "name=$zip" >> $env:GITHUB_OUTPUT

      # Public share without password: the share token is the WebDAV user,
      # the password stays empty. The share must allow uploads.
      - name: Upload to Nextcloud
        shell: bash
        env:
          # Secrets can't be used in a step's if:, so the script skips instead.
          NEXTCLOUD_SHARE_URL: ${{ secrets.NEXTCLOUD_SHARE_URL }}
          ZIP: ${{ steps.zip.outputs.name }}
        run: |
          if [ -z "$NEXTCLOUD_SHARE_URL" ]; then
            echo "NEXTCLOUD_SHARE_URL not set, skipping upload."
            exit 0
          fi
          url="${NEXTCLOUD_SHARE_URL%/}"
          token="${url##*/s/}"
          # Masking matches the whole secret only, not this part of it.
          echo "::add-mask::$token"
          host="${url%%/s/*}"
          curl --fail --show-error -T "dist/$ZIP" -u "$token:" \
               -H "X-Requested-With: XMLHttpRequest" \
               "$host/public.php/webdav/$ZIP"
