name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pyinstaller

      - name: Run tests
        run: python -m pytest -q

      - name: Build exe
        run: pyinstaller --noconfirm hilmars_lostrommel.spec

      # Ship the documented defaults, not whatever config.ini happens to be
      # committed: the exe then always starts from a known, reviewed config.
      - name: Use config template as shipped config
        run: Copy-Item config/config_template.ini dist/config/config.ini -Force

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: hilmars_lostrommel-windows
          path: |
            dist/hilmars_lostrommel.exe
            dist/config/
