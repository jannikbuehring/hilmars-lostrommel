# =============================================================================
# Hilmars Lostrommel - configuration template
# =============================================================================
# Copy this file to config/config.ini and adjust it. The program only reads
# config/config.ini (misc/config.py); this template itself is never loaded.
#
# Every key below is set to its default value:
#   - keys marked [optional] have a fallback in the code; the value shown is that
#     fallback, so leaving the key out behaves exactly like the value here.
#   - keys marked [required] have no fallback; the program fails if they are
#     missing. The value shown is the recommended starting value.
#
# Relative paths are resolved against the directory the program is started from.
# All numeric values must be whole numbers (integers).
# =============================================================================


[files]
# [required] CSV with the draw entries (one row per player/team and competition
# class). Read by data_io/input_reader.py.
draw_data_path = input/draw_input.csv

# [required] CSV with the player master data (start numbers, country, base,
# QTTR, ...). Read by data_io/input_reader.py.
players_path = input/players.csv

# [required] CSV the final draw is written to. The draw report is written next
# to it as <name>_report.csv.
output_file_path = output/output.csv

# [optional] Directory for the interactive HTML bracket pages
# (viewer/bracket_html_exporter.py). Created if it does not exist.
bracket_html_output_dir = output/brackets

# [optional] Directory for the interactive HTML group pages
# (viewer/group_html_exporter.py). Created if it does not exist.
group_html_output_dir = output/groups


[settings]
# [required] Minimum level of log messages printed to the console.
#   10 = debug, 20 = info, 30 = warning, 40 = error, 50 = critical
log_level = 20

# [optional] How the terminal viewers show groups and brackets.
#   normal      - print the finished groups/brackets as tables
#   interactive - step through every snapshot of the draw (for debugging)
mode = normal

# [required, may be empty] Seed for the random number generator.
#   empty  - every run draws differently
#   number - every run with the same seed and the same input produces exactly the
#            same draw (reproducible). The seed is also printed in the HTML footer.
random_seed =


# -----------------------------------------------------------------------------
# Group draw: Monte Carlo optimisation that swaps entries between groups until
# the violation score (weighted sum below) is as low as possible, ideally 0.
# -----------------------------------------------------------------------------
[group_draw]
# [required] Maximum number of swap iterations per attempt.
max_iterations = 20000

# [required] Number of iterations without any improvement after which the
# optimiser considers the search stuck in a local minimum and starts accepting
# worse swaps to escape it.
max_no_improvement_iterations = 5000

# [required] Maximum number of such "escape" swaps (accepted worse swaps) per
# attempt.
max_escape_attempts = 20

# [optional] Number of complete restarts with a new random seed when an attempt
# does not reach a score of 0. The best result over all attempts is kept.
max_seed_retries = 5

# Violation weights - higher = the optimiser tries harder to avoid that kind of
# violation. Only their ratio to each other matters.
#
# [required] Players/teams of one country are not spread evenly over the groups
# (per player outside the ideal band).
country_violation_weight = 1
# [required] Doubles/mixed only: full-country and half-country teams are not
# spread evenly over the groups (per team outside the ideal band).
team_country_violation_weight = 1
# [required] Two opponents in the same group share the same base (club/base).
base_violation_weight = 1
# [required] Singles only: players without a QTTR rating are not spread evenly
# over the groups.
qttr_violation_weight = 1

# [optional] Maximum number of draw snapshots embedded in each group HTML page.
# Older snapshots beyond the cap are merged into the page's start state; the
# final groups are always kept. Lower it if the HTML files get too large.
html_max_snapshots = 20000


# -----------------------------------------------------------------------------
# Bracket draw: places the group finishers into the knock-out brackets
# (main and consolation) in several phases, then refines them per quarter.
# -----------------------------------------------------------------------------
[bracket_draw]
# [optional] Number of random reshuffles tried per bracket quarter in the final
# Monte Carlo refinement (phase 5). Also scales the fallback fill for very tight
# brackets (4 x max_attempts iterations). Higher = better brackets, slower draw.
max_attempts = 2000

# [optional] Last phase to run (1-5).
#   1 - stop after placing the group winners and byes (for debugging)
#   5 - run all phases (normal operation)
max_draw_phase = 5

# [optional] Evaluation budget for placing a batch of seeds/bye recipients in
# phase 1/1b. A batch is solved exactly when the number of possible assignments
# fits this budget, otherwise a hill-climb runs for this many iterations.
# Higher = better placement of large batches, slower draw.
joint_batch_max_evaluations = 5000

# Bracket weights (lower total score = better bracket).
#
# The weights form three tiers that are compared in order: any violation in a
# higher tier outweighs everything in the tiers below, no matter the numbers.
# A weight therefore only trades off against the other weights of its OWN tier.
# The program checks the orderings noted below at draw time and logs a warning
# if they are broken.
#
# --- Tier 1 (hard rules - should never be violated) ---
# [optional] 2nd/3rd of a group are not in different quarters of the half
# opposite their group winner.
quarter_split_weight = 200
# [optional] Group positions 1+4 and 2+3 are not in opposite halves.
half_split_weight = 150
# [optional] Two group winners meet in round 1 (only counted where the bracket
# does not force it, i.e. more winners than matches).
first_vs_first_weight = 100
#
# --- Tier 2 (round-1 matchup quality) ---
# [optional] A group winner does not get a BYE or a lowest-placed opponent.
# Must be greater than bottom_vs_bottom_weight.
top_easy_opponent_weight = 70
# [optional] Two lowest-placed players of their groups meet in round 1.
bottom_vs_bottom_weight = 50
#
# --- Tier 3 (distribution) ---
# [optional] Two players of the same country meet in round 1.
country_first_weight = 35
# [optional] Players of one country are not spread evenly over the two halves
# (per player of imbalance).
country_half_weight = 10
# [optional] Players of one country are not spread evenly over the four quarters
# (per player of imbalance).
# Must hold: country_first_weight > country_half_weight > country_quarter_weight
country_quarter_weight = 4
# [optional] Two players of the same base meet in round 1.
base_first_weight = 20
#
# --- Round 2 matchup quality ---
# With many byes, round 1 is mostly walkovers and round 2 is the first round
# that decides anything, so the round-1 matchup rules are also graded for
# round 2 while byes are placed (phase 1/1b/1c).
#
# [optional] Two group winners would meet in round 2.
round_two_first_vs_first_weight = 45
# [optional] A group winner would meet a runner-up (not a lowest-placed player)
# in round 2.
round_two_top_easy_opponent_weight = 42
# [optional] Two lowest-placed players would meet in round 2.
round_two_bottom_vs_bottom_weight = 38
# The three weights above must lie strictly between the highest country weight
# (country_first_weight) and the lowest round-1 matchup weight
# (min of first_vs_first / top_easy_opponent / bottom_vs_bottom), i.e. 36..49
# with the defaults.
#
# [optional] Two players of the same country would meet in round 2.
# Must lie strictly between country_quarter_weight and country_half_weight.
round_two_country_first_weight = 9
