[files]
# draw input file path
draw_data_path = input/draw_input.csv
#draw_data_path = input/draw_input_2026_20260626_test.csv
# player input file path
players_path = input/players.csv
#players_path = input/players_2026_test.csv
# output file path
output_file_path = output/output.csv
# directory for HTML bracket exports (viewer.bracket_html_exporter)
bracket_html_output_dir = output/brackets
# directory for HTML group exports (viewer.group_html_exporter)
group_html_output_dir = output/groups

[settings]
# possible values: [10 (debug), 20 (info), 30 (warning), 40 (error), 50 (critical)] 
log_level = 20
# possible modes: [normal, interactive] 
# normal - default value
# interactive - step through each seeding process to debug
mode = interactive
# if a seed is set, all random outcomes will be deterministic, meaning they will always produce the same results
# choose a number
random_seed = 789123

# for fine tuning the monte carlo optimization
[group_draw]
# maximum number of iterations to perform
max_iterations = 20000
# number of iterations without improvement before considering escaping local minima
max_no_improvement_iterations = 5000
# number of times to escape local minima by randomizing part of the solution
max_escape_attempts = 20
# number of times to restart with a new random seed if no perfect solution is found
max_seed_retries = 10
country_violation_weight = 1
team_country_violation_weight = 1
base_violation_weight = 1
qttr_violation_weight = 1
# cap on the snapshots embedded in the HTML export (viewer.group_html_exporter).
# The oldest snapshots beyond it are collapsed into the page's start state, so
# the final groups are always preserved.
html_max_snapshots = 20000

[bracket_draw]
# maximum number of randomized attempts to find a good bracket assignment
max_attempts = 5000
# Stop after this phase (1 = top-group-pos seeding only, 5 = all phases / default)
max_draw_phase = 5
# Evaluation budget for the joint per-batch assignment in phase 1/1b. A batch is
# solved exactly when its assignment count fits the budget, otherwise a hill-climb
# runs for that many iterations. Higher = better large batches, slower draw.
joint_batch_max_evaluations = 5000
# weights used by bracket_checker.score_bracket (lower score = better bracket)
half_split_weight = 1000
first_vs_first_weight = 100
# a group winner earned a BYE or a lowest-placed round-1 opponent. Must stay ABOVE
# the country weights ("1. gegen dritter oder freilos ist wichtiger als
# laenderverteilung"), and 2x it must stay BELOW half_split_weight and quarter_split
# (fixed at 200) so the soft degrade path never trades away a separation.
top_easy_opponent_weight = 70
# consequence of the above: two lowest-placed players should not meet in round 1
bottom_vs_bottom_weight = 50
# same country facing each other in round 1 - distinct from the country *distribution*
# weights below, which only balance counts across the halves/quarters
country_first_weight = 35
country_half_weight = 20
# country spread across the quarters; deliberately kept below country_half_weight
# so that balancing the halves stays the more important objective
country_quarter_weight = 8
base_first_weight = 10
# Round-two matchup quality (bracket_checker.score_round_two).  With very many byes
# round one is almost all walkovers and round two is the first round that decides
# anything, so the same rules are graded there too. The three tier weights must stay
# BELOW every round-one matchup weight (lowest: bottom_vs_bottom_weight) and ABOVE
# every country weight (highest: country_first_weight) - i.e. in 36..49, which also
# holds against score_bracket's hard-coded defaults. The country term is ranked below
# round one's, between country_half_weight and country_quarter_weight - 9 is the only
# value that satisfies that in both ladders (defaults 10/4, here 20/8).
round_two_first_vs_first_weight = 45
round_two_top_easy_opponent_weight = 42
round_two_bottom_vs_bottom_weight = 38
round_two_country_first_weight = 9